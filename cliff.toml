[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file. Entries are
generated from the conventional commits by [git-cliff](https://git-cliff.org),
except where writing one by hand said more.\n
"""

body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""

footer = """
{% for release in releases -%}
{% if release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: \
{{ release.repository_url }}/compare/{{ release.previous.version }}..{{ release.version }}
{% endif -%}
{% endfor %}
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"

# Strip the gitmoji prefix; `\W` would leave the U+FE0F in sequences like "♻️".
[[git.commit_preprocessors]]
pattern = '^[^\p{L}\p{N}]+'
replace = ""

[[git.commit_parsers]]
message = "^chore\\(release\\)|^chore: release"
skip = true

# Renovate raises these; a dependency bump is not a user-facing change, and the
# release notes are generated from this changelog.
[[git.commit_parsers]]
message = "^chore\\(deps\\)"
skip = true

# Four sections, no more. The numeric prefix fixes their order (group_by sorts
# alphabetically otherwise, which would lead with Bug Fixes); the template
# strips it back out.
[[git.commit_parsers]]
message = "^feat"
group = "<!-- 0 -->Features"

[[git.commit_parsers]]
message = "^fix"
group = "<!-- 1 -->Bug Fixes"

[[git.commit_parsers]]
message = "^perf"
group = "<!-- 2 -->Performance"

# docs, refactor, ci, build, test, style, chore: internal work, one bucket.
[[git.commit_parsers]]
message = ".*"
group = "<!-- 3 -->Misc"
